name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The project is developed on Windows ARM64 and measured there. Linux
        # is in the matrix to prove the code is not tied to that platform.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the measurement stack
        # Only what the tests import: no roboflow, no matplotlib, no trackers.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy onnxruntime opencv-python-headless pyyaml pytest

      - name: Run tests
        run: python -m pytest tests -q

  smoke:
    name: end-to-end smoke test on the tracked ONNX model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy onnxruntime opencv-python-headless pyyaml

      - name: The published model loads, and inference produces the documented shapes
        # The dataset is not versioned, so accuracy cannot be rechecked in CI.
        # What CI can guarantee is that the three tracked ONNX files load and
        # run, and that the postprocessing agrees with them on shapes and class
        # names. That is what breaks silently when a model is re-exported.
        run: |
          python - <<'PY'
          import sys, numpy as np, onnxruntime as ort
          sys.path.insert(0, "src")
          from evaluate import predict

          for path in ("models/baseline_best.onnx",
                       "models/baseline_best_int8_static.onnx",
                       "models/baseline_best_int8_dynamic.onnx"):
              s = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
              inp = s.get_inputs()[0]
              assert inp.shape[1:] == [3, 640, 640], (path, inp.shape)
              meta = s.get_modelmeta().custom_metadata_map
              if "names" in meta:
                  assert "Bird" in meta["names"] and "Drone" in meta["names"], meta["names"]
              img = (np.random.rand(640, 640, 3) * 255).astype(np.uint8)
              boxes, scores, classes = predict(s, inp.name, img, conf=0.5)
              assert boxes.ndim == 2 and boxes.shape[1] == 4, boxes.shape
              assert len(boxes) == len(scores) == len(classes)
              assert classes.size == 0 or set(np.unique(classes)) <= {0, 1}
              print(f"{path}: OK, {len(boxes)} detections on noise")
          PY
